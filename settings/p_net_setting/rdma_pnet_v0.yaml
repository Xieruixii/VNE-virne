#settings/p_net_setting/rdma_pnet.yaml
topology:
  num_nodes: 100
  type: waxman
  wm_alpha: 0.5
  wm_beta: 0.2

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 50
    high: 100

  - name: rdma_capable
    type: information
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 0
    high: 1

  - name: nic_slots
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 4
    high: 8

  - name: qp_budget
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 16
    high: 64

  - name: rack_id
    type: information
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    low: 0
    high: 9

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 50
    high: 100

  - name: latency
    type: latency
    owner: link
    distribution: uniform
    dtype: float
    generative: true
    low: 1
    high: 5

  - name: rdma_link
    type: information
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    low: 0
    high: 1

graph_attrs_setting:

output:
  save_dir: dataset/p_net
  file_name: p_net.gml
